<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メーニュ – 角吉梅島店</title>

    <!-- フォント読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

    <!-- スタイルシート -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css" media="only screen and (max-width: 768px)">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="logo">
            <img src="images/logo.jpg" alt="Logo">
        </div>

        <div class="header-tagline">もつ焼</div>
        <div class="menu-toggle">☰</div>

        <nav>
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="menu.html" class="active">メーニュ</a></li>
                <li><a href="reservation.html">予約</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <!-- メニューバナー -->
    <div id="menuBanner" class="menu-banner">
        <img src="images/menubanner.jpg" alt="Menu Banner">
    </div>

    <!-- メニューページ本体 -->
    <section class="menu-page">
        <h1>メーニュ</h1>

        <!-- カテゴリータブ -->
        <div class="menu-tabs">
            <button onclick="renderMenu(foodData)">全部</button>
            <button onclick="filterCategory('yaki')">焼き物</button>
            <button onclick="filterCategory('itame')">炒め物</button>
            <button onclick="filterCategory('ippin')">一品料理</button>
            <button onclick="filterCategory('agemono')">揚げ物</button>
            <button onclick="filterCategory('drink')">ドリンク</button>
        </div>

        <!-- メニューリスト -->
        <div id="menuList" class="menu-page"></div>
    </section>

    <!-- フッター -->
    <footer class="footer">
        © 2026 居酒屋 – Tokyo, Japan
    </footer>

    <!-- スクリプト -->
    <script src="main.js"></script>
    <script src="menu.js"></script>

</body>
</html>
