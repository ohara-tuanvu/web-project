<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ – 角吉梅島店</title>

    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="mobile.css" media="only screen and (max-width: 768px)">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ヘッダーエリア -->
    <header class="header">
        <div class="logo"><img src="images/logo.jpg"></div>
        <div class="header-tagline">もつ焼</div>
        <div class="menu-toggle">☰</div>

        <nav>
            <ul>
                <li><a href="index.html">ホーム</a></li>
                <li><a href="menu.html">メーニュ</a></li>
                <li><a href="reservation.html">予約</a></li>
                <li><a href="contact.html" class="active">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <!-- お問い合わせフォーム -->
    <section class="contact-container">
        <h1>お問い合わせ</h1>
        <p class="contact-desc">
            ご不明な点やご相談がございましたら、下記フォームよりお気軽にお問い合わせください。
        </p>

        <label>お名前（必須）</label>
        <input type="text" id="name" placeholder="例：山田太郎" required>

        <label>メールアドレス（必須）</label>
        <input type="email" id="email" placeholder="例：example@mail.com" required>

        <label>電話番号（任意）</label>
        <input type="text" id="phone" placeholder="090-1234-5678">

        <label>お問い合わせ種別</label>
        <select id="type">
            <option value="">選択してください</option>
            <option value="予約について">予約について</option>
            <option value="貸切・宴会について">貸切・宴会について</option>
            <option value="メニューについて">メニューについて</option>
            <option value="その他">その他</option>
        </select>

        <label>お問い合わせ内容（必須）</label>
        <textarea id="message" rows="5" placeholder="お問い合わせ内容をご記入ください。" required></textarea>

        <button class="contact-btn" onclick="sendContact()">送信する</button>
    </section>

    <!-- 店舗情報・アクセス・SNS セクション -->
    <section class="contact-info-washi">

        <!-- 店舗情報カード -->
        <div class="washi-card">
            <h2>店舗情報</h2>
            <p>住所：東京都足立区梅島</p>
            <p>電話番号：03-xxxx-xxxx</p>
            <p>営業時間：14:00〜23:00</p>
            <p>土・日・祝：13:00〜23:00</p>
        </div>

        <!-- アクセス情報カード -->
        <div class="washi-card">
            <h2>アクセス</h2>
            <p>東武スカイツリーライン「梅島駅」より徒歩数分。</p>

            <!-- 地図エリア -->
            <div class="washi-map">
                <div class="map-overlay" onclick="window.open('https://maps.app.goo.gl/3fviy5unuEPSouro9', '_blank')"></div>

                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3239.799905064747!2d139.803889!3d35.774915!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188e6c4b0e9e4f%3A0x4f3c3f6e0d70e395!2z44CSMTIwLTAwMjMgVG9reW8sIEFkYWNoaSBDaXR5LCBVbWVqaW1hLCAzIENob21l4oiSIOODreODvOODiOODvOODq-ODiQ!5e0!3m2!1sja!2sjp!4v1717570000000"
                    width="100%" 
                    height="250" 
                    style="border:0;" 
                    allowfullscreen 
                    loading="lazy">
                </iframe>
            </div>
        </div>

    </section>

    <!-- 送信完了ポップアップ -->
    <div class="popup" id="popup">
        <div class="popup-box">
            <h2>送信完了しました</h2>
            <p>内容を確認後、担当者よりご連絡いたします。</p>
            <button onclick="closePopup()">閉じる</button>
        </div>
    </div>

    <!-- EmailJS ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- お問い合わせ送信用スクリプト -->
    <script src="main.js"></script>
    <script src="contact.js"></script>

</body>
</html>
